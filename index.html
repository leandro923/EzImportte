<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pirovan Repuestos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>Pirovan Repuestos</h1>
    <button id="cart-btn">🛒 Carrito (<span id="cart-count">0</span>)</button>
</header>

<!-- Página de Categorías -->
<section id="categories-page">
    <h2>Categorías</h2>
    <div id="categories-list">
        <!-- Las categorías se generan desde JS -->
    </div>
</section>

<!-- Página de Productos -->
<section id="products-page" style="display: none;">
    <button id="back-to-categories">⬅ Volver</button>
    <h2 id="category-title"></h2>

    <!-- Filtro de marcas -->
    <label for="filter-brands">Filtrar por marca:</label>
    <select id="filter-brands">
        <option value="TODO">Todas</option>
    </select>

    <div id="products-list"></div>
</section>

<!-- Carrito lateral -->
<aside id="cart-sidebar" class="hidden">
    <h2>Carrito</h2>
    <div id="cart-items"></div>

    <p class="price-line">
        <strong>Subtotal:</strong> $<span id="cart-subtotal">0</span>
    </p>

    <!-- 🔥 COSTO DE ENVÍO FIJO AGREGADO 🔥 -->
    <p class="price-line">
        <strong>Envío:</strong> $<span id="shipping-cost">5000</span>
    </p>

    <p class="price-line total">
        <strong>Total:</strong> $<span id="cart-total">0</span>
    </p>

    <button id="checkout-btn">Finalizar Compra</button>
</aside>

<script>
// ======================================================
// VARIABLES
// ======================================================

let cart = [];
let currentCategory = null;
let currentBrandFilter = "TODO";

const SHIPPING_COST = 5000;

// Elementos del DOM
const categoriesPage = document.getElementById("categories-page");
const productsPage = document.getElementById("products-page");
const categoryTitleEl = document.getElementById("category-title");
const productsListEl = document.getElementById("products-list");
const filterBrandsEl = document.getElementById("filter-brands");

const cartSidebar = document.getElementById("cart-sidebar");
const cartItemsEl = document.getElementById("cart-items");
const cartSubtotalEl = document.getElementById("cart-subtotal");
const cartTotalEl = document.getElementById("cart-total");

// ======================================================
// CARGAR CATEGORÍAS DESDE data.js
// (Esto asume que tenés un archivo data.js con categories[])
// ======================================================

document.addEventListener("DOMContentLoaded", () => {
    if (typeof categories !== "undefined") {
        loadCategories();
    }
});

// ======================================================
// MOSTRAR CATEGORÍAS
// ======================================================

function loadCategories() {
    const container = document.getElementById("categories-list");
    container.innerHTML = "";

    categories.forEach(cat => {
        const div = document.createElement("div");
        div.className = "category-card";
        div.innerHTML = `
            <img src="${cat.img}" alt="${cat.name}">
            <h3>${cat.name}</h3>
        `;
        div.addEventListener("click", () => openCategory(cat));
        container.appendChild(div);
    });
}

// ======================================================
// ABRIR CATEGORÍA
// ======================================================

function openCategory(cat) {
    currentCategory = cat;
    categoriesPage.style.display = "none";
    productsPage.style.display = "block";
    categoryTitleEl.textContent = cat.name;

    updateBrandFilter(cat.products);
    loadProducts();
}

// ======================================================
// LISTA DE MARCAS PARA FILTRO
// ======================================================

function updateBrandFilter(products) {
    const brands = ["TODO", ...new Set(products.map(p => p.brand))];
    filterBrandsEl.innerHTML = brands.map(b => `<option value="${b}">${b}</option>`).join("");
    currentBrandFilter = "TODO";
}

// ======================================================
// MOSTRAR PRODUCTOS
// ======================================================

function loadProducts() {
    productsListEl.innerHTML = "";

    const filtered = currentCategory.products.filter(p =>
        currentBrandFilter === "TODO" || p.brand === currentBrandFilter
    );

    filtered.forEach(p => {
        const item = document.createElement("div");
        item.className = "product-card";
        item.innerHTML = `
            <img src="${p.img}" alt="${p.name}">
            <h3>${p.name}</h3>
            <p class="brand">${p.brand}</p>
            <p class="price">$${p.price}</p>
            <button class="add-btn">Agregar</button>
        `;
        item.querySelector(".add-btn").addEventListener("click", () => addToCart(p));
        productsListEl.appendChild(item);
    });
}

filterBrandsEl.addEventListener("change", e => {
    currentBrandFilter = e.target.value;
    loadProducts();
});

// ======================================================
// CARRITO
// ======================================================

function addToCart(product) {
    const found = cart.find(p => p.id === product.id);

    if (found) {
        found.qty++;
    } else {
        cart.push({ ...product, qty: 1 });
    }

    updateCart();
    openCart();
}

function removeFromCart(id) {
    cart = cart.filter(p => p.id !== id);
    updateCart();
}

function updateCart() {
    cartItemsEl.innerHTML = "";

    let subtotal = 0;

    cart.forEach(item => {
        subtotal += item.price * item.qty;

        const div = document.createElement("div");
        div.className = "cart-item";
        div.innerHTML = `
            <span>${item.name} (${item.qty})</span>
            <strong>$${item.price * item.qty}</strong>
            <button class="remove-btn">X</button>
        `;
        div.querySelector(".remove-btn").addEventListener("click", () => removeFromCart(item.id));

        cartItemsEl.appendChild(div);
    });

    cartSubtotalEl.textContent = subtotal;

    // TOTAL FINAL (SUBTOTAL + ENVÍO)
    const total = subtotal + SHIPPING_COST;
    cartTotalEl.textContent = total;

    document.getElementById("cart-count").textContent = cart.length;
}

function openCart() {
    cartSidebar.classList.remove("hidden");
}

document.getElementById("cart-btn").addEventListener("click", openCart);

document.getElementById("checkout-btn").addEventListener("click", () => {
    window.location.href = "checkout.html";
});

// Volver a categorías
document.getElementById("back-to-categories").addEventListener("click", () => {
    productsPage.style.display = "none";
    categoriesPage.style.display = "block";
});

</script>

</body>
</html>
